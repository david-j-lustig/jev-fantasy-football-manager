[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-fantasy-football-manager"
version = "0.1.0"
description = "Recommend Sleeper fantasy football lineups, waivers, and trades. Code calculates; TypeSafe Jev judges."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "David Lustig" }]
keywords = ["fantasy-football", "sleeper", "jev", "typesafe", "lineup"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
    "rich>=13",
    "typer>=0.12",
    "typesafe-sdk>=0.6",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
ilp = ["pulp>=2.8"]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/david-j-lustig/jev-fantasy-football-manager"
Repository = "https://github.com/david-j-lustig/jev-fantasy-football-manager"
Issues = "https://github.com/david-j-lustig/jev-fantasy-football-manager/issues"

[project.scripts]
jev-ff = "jev_ff.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jev_ff = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.ruff.format]
quote-style = "double"
